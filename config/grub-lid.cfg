# BGH A470: firmware reports a closed lid at boot while it is physically open.
# Only replace the initial state; keep subsequent lid events and suspend policy.
# An explicit setting in the existing command line takes precedence.
case " ${GRUB_CMDLINE_LINUX:-} ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
    *" button.lid_init_state="*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+${GRUB_CMDLINE_LINUX_DEFAULT} }button.lid_init_state=open" ;;
esac
