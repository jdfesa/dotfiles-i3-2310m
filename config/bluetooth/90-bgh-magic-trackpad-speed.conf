# Initial speed for the exact Bluetooth Magic Trackpad 2 tagged by udev.
# Use the existing Slightly faster preset; manual changes last until reconnect.
Section "InputClass"
    Identifier "BGH Bluetooth Magic Trackpad 2 speed"
    MatchTag "bgh-magic-trackpad-2-bluetooth"
    MatchDriver "libinput"
    MatchIsTouchpad "on"
    Option "AccelSpeed" "0.25"
EndSection
