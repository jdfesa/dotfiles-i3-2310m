# Lightweight, opaque terminal for Intel HD 3000; no visual effects.
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
disable_ligatures always
font_size 11.0
background #1e1e2e
foreground #cdd6f4
cursor #f5e0dc
selection_background #45475a
selection_foreground #cdd6f4
background_opacity 1.0
window_padding_width 4
cursor_blink_interval 0
cursor_trail 0
enable_audio_bell no
repaint_delay 20
input_delay 3
sync_to_monitor yes
scrollback_lines 5000

# Native directory tabs, including the first tab; no custom renderer.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 1
tab_title_template "{(tab.active_wd or title).rstrip('/').rsplit('/', 1)[-1] or '/'}"
active_tab_foreground #1e1e2e
active_tab_background #fab387
active_tab_font_style normal
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244
inactive_tab_font_style normal
tab_bar_background #1e1e2e
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab

# Catppuccin Mocha ANSI palette, matching the topbar.
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
