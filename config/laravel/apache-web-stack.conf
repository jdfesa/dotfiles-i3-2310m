ServerName localhost
ServerTokens Prod
ServerSignature Off
KeepAliveTimeout 2

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require local
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "(^|/)\.git(/|$)">
    Require all denied
</DirectoryMatch>

Include /etc/phpmyadmin/apache.conf
<Directory /usr/share/phpmyadmin>
    Require local
</Directory>
<DirectoryMatch "^/usr/share/phpmyadmin/(setup|vendor)(/|$)">
    Require all denied
</DirectoryMatch>
<LocationMatch "^/phpmyadmin/config\.inc\.php$">
    Require all denied
</LocationMatch>

<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    Redirect permanent / http://127.0.0.1/phpmyadmin/
</VirtualHost>
